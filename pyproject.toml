[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy"
version = "1.0.0"
description = "Multi-Agent Consensus through Tree-Based Exploration - Built on MassGen"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Canopy Team", email = "contact@canopy.dev" },
    { name = "Original MassGen Team", email = "contact@massgen.dev" }
]
keywords = ["ai", "multi-agent", "collaboration", "orchestration", "llm", "gpt", "claude", "gemini", "grok", "consensus", "tree-search", "mcts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "typing-extensions>=4.0.0",
    "PyYAML>=6.0.0",
    "google-genai>=1.27.0",
    "xai-sdk>=0.0.1",
    "textual>=5.0.0",
    "textual-dev>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "autoflake>=2.1.0",
    "pyupgrade>=3.7.0",
    "interrogate>=1.5.0",
    "detect-secrets>=1.4.0",
    "safety>=2.3.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
]
all = [
    "google-generativeai>=0.3.0",
    "anthropic>=0.18.0",
]

[project.scripts]
canopy = "cli:main"
canopy-mcp = "canopy.mcp_server:main"

[project.urls]
Homepage = "https://github.com/yourusername/canopy"
Repository = "https://github.com/yourusername/canopy"
"Bug Reports" = "https://github.com/yourusername/canopy/issues"
Source = "https://github.com/yourusername/canopy"
Documentation = "https://github.com/yourusername/canopy/blob/main/README.md"
"Original MassGen" = "https://github.com/ag2ai/MassGen"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["canopy*", "canopy_core*"]
exclude = ["tests*", "docs*", "future_mass*"]

[tool.setuptools.package-data]
canopy = ["examples/*.yaml"]
canopy_core = ["examples/*.yaml", "backends/.env.example"]
"*" = ["*.json", "*.yaml", "*.yml", "*.md"]

# Black configuration
[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | future_mass
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["future_mass/*"]

# flake8 configuration (in setup.cfg since flake8 doesn't support pyproject.toml yet)
# See .flake8 file for configuration

# mypy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
# Additional strict settings for new code
disallow_any_generics = false
disallow_subclassing_any = false
no_implicit_reexport = true
strict_optional = true

[[tool.mypy.overrides]]
module = "agents.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "future_mass.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.orchestrator"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.agent"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.agents"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.backends.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.main"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.streaming_display"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.tools"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.utils"
ignore_errors = true

[[tool.mypy.overrides]]
module = "canopy_core.logging"
ignore_errors = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["agents", "canopy_core_*"]
omit = [
    "*/tests/*",
    "*/test_*",
    "future_mass/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests", "future_mass"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection for test files

# Interrogate configuration for docstring coverage
[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = ["setup.py", "docs", "build", "tests", "canopy_core/orchestrator.py", "canopy_core/agent.py", "canopy_core/agents.py", "canopy_core/backends", "canopy_core/main.py", "canopy_core/streaming_display.py", "canopy_core/tools.py", "canopy_core/utils.py", "canopy_core/logging.py"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 2
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
